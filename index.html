<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单机德州扑克 (Texas Hold'em)</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/start.css">
    <link rel="stylesheet" href="css/raise.css">
</head>
<body>
    <!-- Start Page -->
    <div id="start-page">
        <div class="start-left">
            <div id="clock-container">
                <div id="time-display">00:00</div>
                <div id="date-display">2024年1月1日 星期一</div>
            </div>
            <div id="greeting-display">你好，欢迎回来</div>
            <div id="user-stats" class="user-stats hidden">
                <div class="stat-item">
                    <span class="stat-label">昵称：</span>
                    <span id="start-nickname">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">余额：</span>
                    <span id="start-balance">--</span>
                </div>
            </div>
        </div>
        <div class="start-right">
            <h1>德州扑克</h1>
            <div class="room-selection">
                <button class="room-btn" data-room="1">初级场 (Min 100)</button>
                <button class="room-btn" data-room="2">中级场 (Min 500)</button>
                <button class="room-btn" data-room="3">高级场 (Min 2000)</button>
            </div>
        </div>
    </div>

    <div id="app" class="hidden">
        <button id="btn-back-home" class="back-btn">返回大厅</button>
        <!-- Settings Button -->
        <button id="btn-settings" class="settings-btn" aria-label="Settings">⚙️</button>
        
        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>设置</h2>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <ul class="settings-menu">
                        <li class="settings-item active" data-target="game-settings">游戏设置</li>
                        <li class="settings-item" data-target="audio-settings">音量设置</li>
                        <li class="settings-item" data-target="ai-settings">AI设置</li>
                        <li class="settings-item" data-target="network-settings">联机设置</li>
                        <li class="settings-item" data-target="about">关于</li>
                    </ul>
                    <div class="settings-panels">
                        <div id="game-settings" class="panel active">
                            <form id="game-settings-form" class="settings-form">
                                <div class="settings-group">
                                    <label for="setting-nickname">昵称（显示名）</label>
                                    <input id="setting-nickname" type="text" maxlength="12" placeholder="我">
                                </div>
                                <div class="settings-group">
                                    <label for="setting-player-chips">玩家初始筹码</label>
                                    <input id="setting-player-chips" type="number" min="1" step="1" value="1000">
                                </div>
                                <div class="settings-group">
                                    <label for="setting-ai-chips">人机初始筹码</label>
                                    <input id="setting-ai-chips" type="number" min="1" step="1" value="1000">
                                </div>
                                <div class="settings-actions">
                                    <button type="button" id="save-settings" class="btn primary">保存</button>
                                    <button type="button" id="reset-settings" class="btn">重置</button>
                                </div>
                            </form>
                        </div>
                        <div id="audio-settings" class="panel">音量设置内容...</div>
                        <div id="ai-settings" class="panel">AI设置内容...</div>
                        <div id="network-settings" class="panel">联机设置内容...</div>
                        <div id="about" class="panel">
                            <h3>关于</h3>
                            <p>作者：<strong>ersalt</strong></p>
                            <p>项目地址：<a href="https://github.com/ersalt/Texas-Hold-em-Poker" target="_blank" rel="noopener">https://github.com/ersalt/Texas-Hold-em-Poker</a></p>
                            <p>开源协议：<strong>MIT License</strong></p>
                            <p>版权所有 © 2026 ersalt</p>
                            <p>Power By Gemini 3.0 Pro</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-table">
            
            <!-- Deck Pile -->
            <div id="deck-pile" class="deck-area">
                <div class="card back"></div>
                <div class="card back" style="position: absolute; top: -2px; left: -2px;"></div>
                <div class="card back" style="position: absolute; top: -4px; left: -4px;"></div>
            </div>

            <div id="community-cards-container">
                <div id="community-cards" class="community-area">
                    <!-- Community cards will go here -->
                    <div class="card-slot"></div>
                    <div class="card-slot"></div>
                    <div class="card-slot"></div>
                    <div class="card-slot"></div>
                    <div class="card-slot"></div>
                </div>
                <div id="pot-container">
                    <div id="pot-chips" class="chip-stack pot-stack"></div>
                    <div id="pot-display">底池（POT）：$0</div>
                </div>
            </div>

            <div id="players-area">
                <!-- Players will be positioned here -->
            </div>

    <div id="controls">
                <button id="btn-fold" class="game-btn fold">弃牌 (Fold)</button>
                <button id="btn-check" class="game-btn check">过牌 (Check)</button>
                <button id="btn-call" class="game-btn call">跟注 (Call)</button>
                <button id="btn-raise" class="game-btn raise">加注 (Raise)</button>
                <button id="btn-allin" class="game-btn allin">全押 (All In)</button>
            </div>
            
            <!-- Raise Control Modal -->
            <div id="raise-control" class="raise-control hidden">
                <div class="raise-header">
                    <span>加注金额</span>
                    <button id="close-raise" class="close-btn">×</button>
                </div>
                <div class="raise-body">
                    <div class="raise-info">
                        <span id="raise-min">Min: 0</span>
                        <span id="raise-max">Max: 0</span>
                    </div>
                    <div class="raise-input-group">
                        <input type="range" id="raise-slider" class="raise-slider" min="0" max="100" step="1">
                        <input type="number" id="raise-amount-input" class="raise-input" value="0">
                    </div>
                    <div class="raise-shortcuts">
                        <button class="shortcut-btn" data-action="min">最小加注</button>
                        <button class="shortcut-btn" data-action="pot">1/2 底池</button>
                        <button class="shortcut-btn" data-action="pot-full">底池</button>
                        <button class="shortcut-btn" data-action="allin">All In</button>
                    </div>
                    <div class="raise-confirm-area">
                        <button id="confirm-raise" class="btn primary">确认加注</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts (Order matters) -->
    <script src="js/utils.js"></script>
    <script src="js/deck.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
